<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subway Runner 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: system-ui, sans-serif; }
    #ui {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; color: white; text-shadow: 0 2px 6px rgba(0,0,0,0.7);
    }
    #score { position: absolute; top: 20px; left: 20px; font-size: 28px; font-weight: 700; }
    #hint { position: absolute; bottom: 20px; left: 20px; font-size: 14px; opacity: 0.85; }
    #gameover {
      position: absolute; inset: 0; display: none; flex-direction: column;
      align-items: center; justify-content: center; background: rgba(0,0,0,0.65);
      pointer-events: auto;
    }
    #gameover h1 { font-size: 48px; margin-bottom: 12px; }
    #gameover p { font-size: 22px; margin-bottom: 28px; }
    #gameover button {
      padding: 12px 36px; font-size: 18px; font-weight: 600;
      background: #e63946; color: white; border: none; border-radius: 8px; cursor: pointer;
    }
    #gameover button:hover { background: #ff4d5a; }
  </style>
</head>
<body>
  <div id="ui">
    <div id="score">Score: 0</div>
    <div id="hint">A / ← — влево &nbsp;&nbsp; D / → — вправо &nbsp;&nbsp; Space — прыжок</div>
    <div id="gameover">
      <h1>Game Over</h1>
      <p id="final-score">Score: 0</p>
      <button id="restart">Заново</button>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // === Game state ===
    let score = 0;
    let speed = 14;
    let isPlaying = true;
    let isGameOver = false;

    const scoreEl = document.getElementById('score');
    const gameoverEl = document.getElementById('gameover');
    const finalScoreEl = document.getElementById('final-score');
    const restartBtn = document.getElementById('restart');

    // === Three.js setup ===
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 40, 120);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 6, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.prepend(renderer.domElement);

    // Lights
    const ambient = new THREE.AmbientLight(0xffffff, 0.55);
    scene.add(ambient);
    const dir = new THREE.DirectionalLight(0xffffff, 1.2);
    dir.position.set(10, 20, 8);
    dir.castShadow = true;
    dir.shadow.mapSize.set(1024, 1024);
    scene.add(dir);

    // === Player ===
    const playerGeo = new THREE.BoxGeometry(1, 1.5, 1);
    const playerMat = new THREE.MeshStandardMaterial({ color: 0xe63946 });
    const player = new THREE.Mesh(playerGeo, playerMat);
    player.position.set(0, 1, 0);
    player.castShadow = true;
    scene.add(player);

    const LANE_WIDTH = 3;
    const LANES = [-LANE_WIDTH, 0, LANE_WIDTH];
    let laneIndex = 1;
    let targetX = 0;
    let velocityY = 0;
    let isGrounded = true;

    // === Track ===
    const SEGMENT_LENGTH = 20;
    const segments = [];
    const segmentGroup = new THREE.Group();
    scene.add(segmentGroup);

    function createSegment(z) {
      const group = new THREE.Group();
      group.position.z = z;

      // Ground
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(12, SEGMENT_LENGTH),
        new THREE.MeshStandardMaterial({ color: 0x4a7c59 })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      group.add(ground);

      // Lane lines
      [-3, 0, 3].forEach(x => {
        const line = new THREE.Mesh(
          new THREE.PlaneGeometry(0.15, SEGMENT_LENGTH),
          new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.4 })
        );
        line.rotation.x = -Math.PI / 2;
        line.position.set(x, 0.02, 0);
        group.add(line);
      });

      // Walls
      [-6.5, 6.5].forEach(x => {
        const wall = new THREE.Mesh(
          new THREE.BoxGeometry(1, 3, SEGMENT_LENGTH),
          new THREE.MeshStandardMaterial({ color: 0x555555 })
        );
        wall.position.set(x, 1.5, 0);
        wall.castShadow = true;
        group.add(wall);
      });

      // Random obstacle (simple box)
      if (Math.random() > 0.45) {
        const lane = LANES[Math.floor(Math.random() * 3)];
        const obs = new THREE.Mesh(
          new THREE.BoxGeometry(1.4, 1.4, 1.4),
          new THREE.MeshStandardMaterial({ color: 0x333333 })
        );
        obs.position.set(lane, 0.7, 0);
        obs.castShadow = true;
        obs.userData.isObstacle = true;
        obs.userData.lane = lane;
        group.add(obs);
      }

      segmentGroup.add(group);
      return group;
    }

    // Initial segments
    for (let i = 0; i < 14; i++) {
      segments.push(createSegment(-i * SEGMENT_LENGTH));
    }

    // === Controls ===
    window.addEventListener('keydown', (e) => {
      if (!isPlaying) return;
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') {
        laneIndex = Math.max(0, laneIndex - 1);
        targetX = LANES[laneIndex];
      }
      if (e.code === 'KeyD' || e.code === 'ArrowRight') {
        laneIndex = Math.min(2, laneIndex + 1);
        targetX = LANES[laneIndex];
      }
      if ((e.code === 'Space' || e.code === 'KeyW' || e.code === 'ArrowUp') && isGrounded) {
        velocityY = 11;
        isGrounded = false;
      }
    });

    restartBtn.addEventListener('click', () => {
      // Reset
      score = 0;
      speed = 14;
      isPlaying = true;
      isGameOver = false;
      laneIndex = 1;
      targetX = 0;
      velocityY = 0;
      isGrounded = true;
      player.position.set(0, 1, 0);
      gameoverEl.style.display = 'none';
      scoreEl.textContent = 'Score: 0';

      // Clear old segments
      while (segmentGroup.children.length) {
        segmentGroup.remove(segmentGroup.children[0]);
      }
      segments.length = 0;
      for (let i = 0; i < 14; i++) {
        segments.push(createSegment(-i * SEGMENT_LENGTH));
      }
    });

    // === Game loop ===
    const clock = new THREE.Clock();
    let lastSegmentZ = 0;

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.05);

      if (isPlaying) {
        // Move player forward
        player.position.z -= speed * delta;

        // Smooth lane change
        player.position.x += (targetX - player.position.x) * 14 * delta;

        // Jump
        velocityY -= 28 * delta;
        player.position.y += velocityY * delta;
        if (player.position.y <= 1) {
          player.position.y = 1;
          velocityY = 0;
          isGrounded = true;
        }

        // Score
        score += speed * delta * 0.5;
        scoreEl.textContent = 'Score: ' + Math.floor(score);

        // Speed up slowly
        speed += delta * 0.15;

        // Camera follow
        camera.position.x += (player.position.x * 0.6 - camera.position.x) * 0.08;
        camera.position.y += (player.position.y + 5.5 - camera.position.y) * 0.08;
        camera.position.z += (player.position.z + 11 - camera.position.z) * 0.12;
        camera.lookAt(player.position.x, player.position.y + 1.2, player.position.z - 5);

        // Recycle segments
        const playerZ = player.position.z;
        segments.forEach(seg => {
          if (seg.position.z > playerZ + 30) {
            // Move to the front
            const minZ = Math.min(...segments.map(s => s.position.z));
            seg.position.z = minZ - SEGMENT_LENGTH;

            // Re-randomize obstacle
            seg.children.forEach(child => {
              if (child.userData.isObstacle) {
                seg.remove(child);
              }
            });
            if (Math.random() > 0.4) {
              const lane = LANES[Math.floor(Math.random() * 3)];
              const obs = new THREE.Mesh(
                new THREE.BoxGeometry(1.4, 1.4, 1.4),
                new THREE.MeshStandardMaterial({ color: 0x333333 })
              );
              obs.position.set(lane, 0.7, 0);
              obs.castShadow = true;
              obs.userData.isObstacle = true;
              obs.userData.lane = lane;
              seg.add(obs);
            }
          }
        });

        // Simple collision
        segments.forEach(seg => {
          seg.children.forEach(child => {
            if (child.userData.isObstacle) {
              const dx = Math.abs(player.position.x - (seg.position.x + child.position.x));
              const dz = Math.abs(player.position.z - (seg.position.z + child.position.z));
              const dy = player.position.y;

              if (dx < 1.1 && dz < 1.2 && dy < 2.2) {
                // Hit!
                isPlaying = false;
                isGameOver = true;
                finalScoreEl.textContent = 'Score: ' + Math.floor(score);
                gameoverEl.style.display = 'flex';
              }
            }
          });
        });
      }

      renderer.render(scene, camera);
    }

    animate();

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
